<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&amp;display=swap');
            text { font-family: 'Noto Sans KR', sans-serif; }
        </style>
    </defs>
    <rect width="400" height="200" fill="#FDFCF8" rx="12" />
    
    <!-- Triangle -->
    <polygon points="200,40 100,120 300,120" fill="#FADBD8" stroke="#E74C3C" stroke-width="2"/>
    
    <!-- Angle arcs -->
    <path d="M 200 60 A 20 20 0 0 1 185 52" fill="none" stroke="#C0392B" stroke-width="2"/>
    <path d="M 120 120 A 20 20 0 0 1 115 108" fill="none" stroke="#C0392B" stroke-width="2"/>
    <path d="M 285 108 A 20 20 0 0 1 280 120" fill="none" stroke="#C0392B" stroke-width="2"/>
    
    <text x="200" y="80" text-anchor="middle" font-size="14" fill="#C0392B">가</text>
    <text x="135" y="115" text-anchor="middle" font-size="14" fill="#C0392B">나</text>
    <text x="265" y="115" text-anchor="middle" font-size="14" fill="#C0392B">다</text>
    
    <text x="200" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#C0392B">가 + 나 + 다 = 180°</text>
</svg>
