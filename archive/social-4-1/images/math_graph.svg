<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&amp;display=swap');
            text { font-family: 'Noto Sans KR', sans-serif; }
        </style>
    </defs>
    <rect width="400" height="200" fill="#FDFCF8" rx="12" />
    
    <!-- Axes -->
    <line x1="50" y1="150" x2="350" y2="150" stroke="#2C3E50" stroke-width="2"/>
    <line x1="50" y1="150" x2="50" y2="30" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Grid -->
    <line x1="50" y1="120" x2="350" y2="120" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="50" y1="90" x2="350" y2="90" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="50" y1="60" x2="350" y2="60" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Lines -->
    <path d="M 100 130 L 175 100 L 250 110 L 325 50" fill="none" stroke="#27AE60" stroke-width="3"/>
    
    <!-- Points -->
    <circle cx="100" cy="130" r="5" fill="#E74C3C" />
    <circle cx="175" cy="100" r="5" fill="#E74C3C" />
    <circle cx="250" cy="110" r="5" fill="#E74C3C" />
    <circle cx="325" cy="50" r="5" fill="#E74C3C" />
    
    <!-- Text -->
    <text x="100" y="170" text-anchor="middle" font-size="12" fill="#2C3E50">1월</text>
    <text x="175" y="170" text-anchor="middle" font-size="12" fill="#2C3E50">2월</text>
    <text x="250" y="170" text-anchor="middle" font-size="12" fill="#2C3E50">3월</text>
    <text x="325" y="170" text-anchor="middle" font-size="12" fill="#2C3E50">4월</text>
    
    <text x="200" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#2C3E50">시간의 흐름을 꺾은선그래프로!</text>
</svg>
