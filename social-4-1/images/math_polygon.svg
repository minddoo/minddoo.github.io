<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&amp;display=swap');
            text { font-family: 'Noto Sans KR', sans-serif; }
        </style>
    </defs>
    <rect width="400" height="200" fill="#FDFCF8" rx="12" />
    
    <!-- Hexagon -->
    <polygon points="120,100 160,40 240,40 280,100 240,160 160,160" fill="#D4E6F1" stroke="#2980B9" stroke-width="2"/>
    
    <!-- Diagonals -->
    <line x1="120" y1="100" x2="240" y2="40" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="120" y1="100" x2="280" y2="100" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="120" y1="100" x2="240" y2="160" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Nodes -->
    <circle cx="120" cy="100" r="4" fill="#E74C3C" />
    <circle cx="160" cy="40" r="4" fill="#2980B9" />
    <circle cx="240" cy="40" r="4" fill="#2980B9" />
    <circle cx="280" cy="100" r="4" fill="#2980B9" />
    <circle cx="240" cy="160" r="4" fill="#2980B9" />
    <circle cx="160" cy="160" r="4" fill="#2980B9" />
    
    <text x="200" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#2980B9">다각형의 대각선 (빨간 점선)</text>
</svg>
