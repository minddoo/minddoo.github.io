<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&amp;display=swap');
            text { font-family: 'Noto Sans KR', sans-serif; }
        </style>
    </defs>
    <rect width="400" height="200" fill="#FDFCF8" rx="12" />
    
    <!-- Option A -->
    <rect x="40" y="40" width="120" height="80" rx="8" fill="#EBF5FB" stroke="#2C3E50" stroke-width="2"/>
    <text x="100" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#2C3E50">사고 싶은 물건</text>
    <text x="100" y="100" text-anchor="middle" font-size="14" fill="#566573">(장난감, 학용품)</text>
    
    <!-- Option B -->
    <rect x="240" y="40" width="120" height="80" rx="8" fill="#E9F7EF" stroke="#27AE60" stroke-width="2"/>
    <text x="300" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#27AE60">가진 용돈</text>
    <text x="300" y="100" text-anchor="middle" font-size="14" fill="#566573">(한정된 자원)</text>
    
    <!-- Balance / Arrow -->
    <path d="M170 80 L190 80 L190 70 L210 90 L190 110 L190 100 L170 100 Z" fill="#F39C12" />
    <path d="M230 80 L210 80 L210 70 L190 90 L210 110 L210 100 L230 100 Z" fill="#F39C12" />
    
    <!-- Result -->
    <rect x="120" y="140" width="160" height="40" rx="20" fill="#2C3E50" />
    <text x="200" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">가장 합리적인 선택!</text>
</svg>
