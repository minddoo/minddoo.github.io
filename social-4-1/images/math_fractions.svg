<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&amp;display=swap');
            text { font-family: 'Noto Sans KR', sans-serif; }
        </style>
    </defs>
    <rect width="400" height="200" fill="#FDFCF8" rx="12" />
    
    <!-- Fraction Circle 1 -->
    <circle cx="100" cy="80" r="50" fill="#EBF5FB" stroke="#2980B9" stroke-width="2"/>
    <path d="M 100 30 A 50 50 0 0 1 150 80 L 100 80 Z" fill="#3498DB" stroke="#2980B9" stroke-width="1"/>
    <line x1="50" y1="80" x2="150" y2="80" stroke="#2980B9" stroke-width="2"/>
    <line x1="100" y1="30" x2="100" y2="130" stroke="#2980B9" stroke-width="2"/>
    
    <text x="100" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#2980B9">1 / 4</text>
    
    <text x="200" y="85" text-anchor="middle" font-size="30" font-weight="700" fill="#2C3E50">+</text>
    
    <!-- Fraction Circle 2 -->
    <circle cx="300" cy="80" r="50" fill="#EBF5FB" stroke="#27AE60" stroke-width="2"/>
    <path d="M 300 30 A 50 50 0 0 1 350 80 L 300 80 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="1"/>
    <path d="M 350 80 A 50 50 0 0 1 300 130 L 300 80 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="1"/>
    <line x1="250" y1="80" x2="350" y2="80" stroke="#27AE60" stroke-width="2"/>
    <line x1="300" y1="30" x2="300" y2="130" stroke="#27AE60" stroke-width="2"/>
    
    <text x="300" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#27AE60">2 / 4</text>
    
    <text x="200" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#2C3E50">분모는 그대로! 분자끼리 더해요!</text>
</svg>
