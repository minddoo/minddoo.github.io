<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&amp;display=swap');
            text { font-family: 'Noto Sans KR', sans-serif; }
        </style>
    </defs>
    <rect width="400" height="200" fill="#FDFCF8" rx="12" />
    
    <!-- Trapezoid -->
    <polygon points="50,110 80,60 110,60 140,110" fill="#FAD7A1" stroke="#E67E22" stroke-width="2"/>
    <text x="95" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#E67E22">사다리꼴</text>
    
    <!-- Parallelogram -->
    <polygon points="170,110 210,60 260,60 220,110" fill="#A9DFBF" stroke="#27AE60" stroke-width="2"/>
    <text x="215" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#27AE60">평행사변형</text>
    
    <!-- Rectangle -->
    <rect x="290" y="60" width="80" height="50" fill="#AED6F1" stroke="#2980B9" stroke-width="2"/>
    <text x="330" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#2980B9">직사각형</text>
    
    <text x="200" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#2C3E50">다양한 사각형들</text>
</svg>
