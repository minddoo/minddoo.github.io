<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&amp;display=swap');
            text { font-family: 'Noto Sans KR', sans-serif; }
        </style>
    </defs>
    <rect width="400" height="200" fill="#FDFCF8" rx="12" />
    
    <!-- Region A (Mountain) -->
    <path d="M 40 120 L 80 50 L 120 120 Z" fill="#27AE60" opacity="0.8"/>
    <path d="M 70 120 L 100 70 L 140 120 Z" fill="#2ECC71" opacity="0.6"/>
    <text x="90" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#27AE60">산촌 (산지)</text>
    <text x="90" y="170" text-anchor="middle" font-size="13" fill="#566573">버섯, 나물</text>
    
    <!-- Exchange Arrows -->
    <path d="M 160 80 Q 200 50 240 80 L 235 90 Q 200 65 165 90 Z" fill="#2C3E50"/>
    <polygon points="245,75 235,65 240,85" fill="#2C3E50"/>
    
    <path d="M 240 120 Q 200 150 160 120 L 165 110 Q 200 135 235 110 Z" fill="#E67E22"/>
    <polygon points="155,125 165,135 160,115" fill="#E67E22"/>
    
    <text x="200" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#2C3E50">필요한 물건 교환</text>
    
    <!-- Region B (Sea) -->
    <path d="M 260 110 Q 280 90 300 110 T 340 110 L 340 120 L 260 120 Z" fill="#3498DB"/>
    <path d="M 270 120 Q 290 100 310 120 T 350 120 L 350 130 L 270 130 Z" fill="#2980B9"/>
    <text x="310" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#2980B9">어촌 (바다)</text>
    <text x="310" y="170" text-anchor="middle" font-size="13" fill="#566573">생선, 미역</text>
</svg>
